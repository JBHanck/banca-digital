spring.application.name=banca-digital
server.port=8080

# Base de datos H2 en archivo (los datos persisten entre reinicios)
spring.datasource.url=jdbc:h2:file:./data/bancadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Seguridad JWT (en produccion definir BANCA_JWT_SECRET con al menos 32 caracteres)
banca.jwt.secret=${BANCA_JWT_SECRET:clave-secreta-solo-para-desarrollo-banca-digital-2026}
banca.jwt.expiracion-minutos=60

# Zona horaria para calcular la "jornada" del tope diario
banca.zona-horaria=America/Bogota
